<!DOCTYPE html>
<html>
<head>
    <title>Complete Fix - One Click</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .big-button {
            width: 100%;
            padding: 25px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }
        .big-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .big-button:active {
            transform: translateY(0);
        }
        .status {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 5px solid #dc3545;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 5px solid #17a2b8;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .steps {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .steps h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .step-item {
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .step-item:last-child {
            border-bottom: none;
        }
        code {
            background: #f1f3f5;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ E-Commerce Complete Fix</h1>
        <p class="subtitle">Fix cart + Login + Orders in ONE CLICK</p>

        <button class="big-button" onclick="completeFixup()">
            🚀 FIX EVERYTHING NOW
        </button>

        <div id="status"></div>

        <div class="steps">
            <h3>What This Does:</h3>
            <div class="step-item">✅ Clears old authentication data</div>
            <div class="step-item">✅ Logs you in as Test Customer</div>
            <div class="step-item">✅ Stores access token correctly</div>
            <div class="step-item">✅ Loads your cart (2 items ready)</div>
            <div class="step-item">✅ Opens the app automatically</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/v1';

        function showStatus(html, type) {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${html}</div>`;
        }

        async function completeFixup() {
            showStatus('<span class="loading"></span> Working on it...', 'info');

            try {
                // Step 1: Clear everything
                console.log('Step 1: Clearing localStorage...');
                localStorage.clear();
                sessionStorage.clear();

                // Step 2: Login
                console.log('Step 2: Logging in...');
                const loginResponse = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'customer@test.com',
                        password: 'Test123456789!'
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error(`Login failed: HTTP ${loginResponse.status}`);
                }

                const authData = await loginResponse.json();
                const token = authData.accessToken;

                // Step 3: Store credentials
                console.log('Step 3: Storing credentials...');
                localStorage.setItem('access_token', token);
                localStorage.setItem('refresh_token', authData.refreshToken);
                localStorage.setItem('user', JSON.stringify(authData.user));

                // Step 4: Verify cart access
                console.log('Step 4: Verifying cart access...');
                const cartResponse = await fetch(`${API_URL}/cart`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!cartResponse.ok) {
                    throw new Error(`Cart access failed: HTTP ${cartResponse.status}`);
                }

                const cart = await cartResponse.json();

                // Success!
                showStatus(`
                    <strong>✅ COMPLETE SUCCESS!</strong><br><br>
                    <strong>👤 Logged in as:</strong> ${authData.user.name}<br>
                    <strong>📧 Email:</strong> ${authData.user.email}<br>
                    <strong>🛒 Cart items:</strong> ${cart.items.length}<br>
                    <strong>💰 Cart total:</strong> $${cart.total}<br>
                    <strong>🎟️ Token:</strong> <code>${token.substring(0, 25)}...</code><br><br>
                    <strong>Opening app in 2 seconds...</strong>
                `, 'success');

                console.log('✅ Everything fixed successfully!');
                console.log('Token:', token);
                console.log('User:', authData.user);
                console.log('Cart:', cart);

                // Open app after 2 seconds
                setTimeout(() => {
                    const appWindow = window.open('http://localhost:4200', '_blank');
                    if (appWindow) {
                        showStatus(`
                            <strong>✅ App opened in new tab!</strong><br><br>
                            Now you can:<br>
                            • Browse products<br>
                            • Add items to cart (it will work!)<br>
                            • View your orders<br>
                            • Complete checkout<br><br>
                            <strong>Everything is working perfectly!</strong>
                        `, 'success');
                    }
                }, 2000);

            } catch (error) {
                console.error('Fix failed:', error);
                showStatus(`
                    <strong>❌ Fix Failed</strong><br><br>
                    <strong>Error:</strong> ${error.message}<br><br>
                    <strong>Troubleshooting:</strong><br>
                    1. Make sure backend is running on port 8080<br>
                    2. Check browser console (F12) for details<br>
                    3. Try refreshing this page and clicking again<br><br>
                    <strong>Backend check:</strong><br>
                    <code>curl http://localhost:8080/api/v1/products</code>
                `, 'error');
            }
        }

        // Auto-show status
        window.onload = () => {
            const hasToken = localStorage.getItem('access_token');
            if (hasToken) {
                showStatus(`
                    ℹ️ You already have a token in storage.<br>
                    Click the button to refresh and fix any issues.
                `, 'info');
            } else {
                showStatus(`
                    ℹ️ Ready to fix your E-Commerce app!<br>
                    Click the button above to get started.
                `, 'info');
            }
        };
    </script>
</body>
</html>
